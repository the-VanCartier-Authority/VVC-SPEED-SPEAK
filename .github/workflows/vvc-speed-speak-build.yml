#!/usr/bin/env python3
"""Generate an Android/Kotlin project using Google GenAI SDK."""
from __future__ import annotations

import json
import os
import pathlib
import sys
import time
from google import genai
from google.genai import types
from pydantic import BaseModel

ROOT = pathlib.Path.cwd().resolve()
README = ROOT / "README.md"
API_KEY = os.environ.get("GEMINI_API_KEY")
MODEL_NAME = os.environ.get("GEMINI_MODEL", "gemini-1.5-flash")

if not API_KEY:
    raise SystemExit("GEMINI_API_KEY is required")
if not README.exists():
    raise SystemExit("README.md was not found at the repository root")

readme = README.read_text(encoding="utf-8")
if len(readme) > 180_000:
    raise SystemExit("README.md is too large for this workflow; reduce it below 180,000 characters")

ALLOWED_ROOTS = ("app/", "gradle/", "buildSrc/", "scripts/")
ALLOWED_EXACT = {"README.md", "settings.gradle.kts", "build.gradle.kts", "gradle.properties", ".gitignore"}


class FileItem(BaseModel):
    path: str
    content: str


class ProjectResponse(BaseModel):
    summary: str
    files: list[FileItem]


def call_gemini_sdk(prompt: str) -> ProjectResponse:
    client = genai.Client(api_key=API_KEY)
    
    config = types.GenerateContentConfig(
        temperature=0.15,
        response_mime_type="application/json",
        response_schema=ProjectResponse,
    )

    max_retries = 3
    base_delay = 10

    for attempt in range(1, max_retries + 1):
        try:
            response = client.models.generate_content(
                model=MODEL_NAME,
                contents=prompt,
                config=config,
            )
            # Retorna directamente el objeto estructurado validado por Pydantic
            return response.parsed
        except Exception as exc:
            if attempt < max_retries:
                sleep_time = base_delay * attempt
                print(f"[Aviso] Reintento ({attempt}/{max_retries}) en {sleep_time}s por: {exc}", file=sys.stderr)
                time.sleep(sleep_time)
            else:
                raise SystemExit(f"Falla crítica en comunicación con Gemini API: {exc}") from exc


def write_files(files_list: list[FileItem]) -> list[str]:
    written = []
    for item in files_list:
        relative = item.path.replace("\\", "/")
        target = (ROOT / relative).resolve()

        try:
            target.relative_to(ROOT)
        except ValueError:
            raise SystemExit(f"Ruta insegura detectada fuera de ROOT: {relative}")

        if relative.startswith("/") or ".." in pathlib.PurePosixPath(relative).parts:
            raise SystemExit(f"Ruta relativa no permitida: {relative}")

        if relative not in ALLOWED_EXACT and not relative.startswith(ALLOWED_ROOTS):
            raise SystemExit(f"Ruta fuera de los límites permitidos del proyecto: {relative}")

        target.parent.mkdir(parents=True, exist_ok=True)
        target.write_text(item.content, encoding="utf-8")
        written.append(relative)
    return written


# ==========================================
# EJECUCIÓN
# ==========================================
print("Ejecutando generación de código con Gemini SDK...", file=sys.stderr)

prompt = f"""
You are the senior Android engineer for the VVC SPEED SPEAK project.
Generate the full Android project structure.

Requirements:
- Root files: settings.gradle.kts, build.gradle.kts, gradle.properties, .gitignore.
- App files: app/build.gradle.kts, app/src/main/AndroidManifest.xml.
- Application ID / Package: com.vvc.speedspeak (minSdk: 26, compileSdk/targetSdk: 35).
- Enable Jetpack Compose and Kotlin DSL.
- Jetpack Compose UI (Cyberpunk style: deep black, neon violet, neon cyan).
- ViewModel with state handling (text input, speed controls, audio controls).
- Local TTS abstraction.
- Report at: app/src/main/assets/VVC_SPEED_SPEAK_APPLICATION_REPORT.md

Repository spec:
--- README.md ---
{readme}
--- END README.md ---
"""

result = call_gemini_sdk(prompt)
written_files = write_files(result.files)

report = ROOT / "app/src/main/assets/VVC_SPEED_SPEAK_APPLICATION_REPORT.md"
if not report.exists():
    report.parent.mkdir(parents=True, exist_ok=True)
    report.write_text(
        "# VVC SPEED SPEAK — Informe de generación\n\n"
        + str(result.summary)
        + "\n",
        encoding="utf-8",
    )

print(
    json.dumps(
        {
            "model": MODEL_NAME,
            "status": "success",
            "files_written": sorted(set(written_files)),
            "report": str(report),
        },
        ensure_ascii=False,
        indent=2,
    )
)
