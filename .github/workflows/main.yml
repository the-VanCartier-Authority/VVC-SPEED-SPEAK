name: VVC Speed Speak - Cloud APK Builder

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # =============================================================
  # Job 1: Build Native Android APK (Kotlin / Jetpack Compose)
  # =============================================================
  build-android-native:
    name: Build Android APK (Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # La acción intenta instalar "tools" por defecto, pero ese paquete
          # legado ya no existe en los repositorios actuales del SDK.
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Decode Keystore (if secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding upload keystore from secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
          else
            echo "No custom keystore found in secrets. Generating standard upload key..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" -dname "CN=VVCSpeedSpeak, OU=Mobile, O=VVC, L=City, S=State, C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: my-upload-key.jks
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VVC-Speed-Speak-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VVC-Speed-Speak-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # =============================================================
  # Job 2: Build with Python & Buildozer (Optional / Alternate)
  # =============================================================
  build-buildozer:
    name: Buildozer Python APK (Kokoro / Kivy)
    runs-on: ubuntu-22.04
    if: false # Set to true if building exclusively via Buildozer workflow
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Python Dependencies & Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv
          pip install -r requirements.txt || true

      - name: Build APK with Buildozer
        run: |
          buildozer android debug
        env:
          P4A_RELEASE_KEYSTORE: ${{ secrets.KEYSTORE_PATH }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.STORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Buildozer APK
        uses: actions/upload-artifact@v4
        with:
          name: VVC-Speed-Speak-Buildozer-APK
          path: bin/*.apk
